name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    
    - name: Restore dependencies
      run: cd backend/OneMart.API && dotnet restore
    
    - name: Build backend
      run: cd backend/OneMart.API && dotnet build --configuration Release --no-restore
    
    - name: Run backend tests
      run: cd backend/OneMart.API && dotnet test --configuration Release --no-build --verbosity normal
    
    - name: Publish backend
      if: success()
      run: cd backend/OneMart.API && dotnet publish -c Release -o ../../dist/backend

  frontend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install dependencies
      run: cd frontend && npm ci
    
    - name: Run linter
      run: cd frontend && npm run lint || true
    
    - name: Build frontend
      run: cd frontend && npm run build
    
    - name: Upload frontend build artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: frontend/dist

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build and push Docker images
      run: |
        docker-compose -f docker-compose.yml build
        # Add push commands here if you have a registry
