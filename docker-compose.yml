version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "7000:7000"
      - "7001:7001"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=https://+:7001;http://+:7000
    volumes:
      - ./backend/OneMart.API:/app
    networks:
      - onemart-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=https://backend:7001/api
    depends_on:
      - backend
    networks:
      - onemart-network

networks:
  onemart-network:
    driver: bridge
